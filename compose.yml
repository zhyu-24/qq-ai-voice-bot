services:
  astrbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: aemeath-astrbot:local
    container_name: aemeath-qq-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6185:6185" # AstrBot WebUI; keep private by default
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/AstrBot/data
